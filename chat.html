<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAT - ALFARIZI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:#000;color:#fff;min-height:100vh;overflow:hidden}
.wrap{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:linear-gradient(180deg,rgba(240,242,245,.14),rgba(200,200,200,.06) 30%,rgba(0,0,0,.92));display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.15);border-right:1px solid rgba(255,255,255,.15);overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:14px;background:rgba(240,242,245,.10);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.12);position:sticky;top:0;z-index:20;flex-shrink:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.top .burger{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(180,180,180,.7));color:#111;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top b{flex:1;font-size:17px;min-width:0}.top b span{font-size:10px;display:block;color:#ccc;letter-spacing:1px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:900;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,.85);color:#111;display:flex;align-items:center;gap:4px;flex-shrink:0}
.home{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.9);color:#111;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.me{flex-shrink:0;margin:0;padding:10px 12px;background:rgba(240,242,245,.12);backdrop-filter:blur(10px);color:#fff;display:flex;align-items:center;gap:11px;box-shadow:0 4px 10px rgba(0,0,0,.3);border-bottom:1px solid rgba(255,255,255,.12)}
.me .ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#e8e8e8,#9a9a9a);color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;flex-shrink:0;position:relative}
.me .ava .dotOnline{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#00a884;border:2px solid #111}
.me b{font-size:16px;color:#fff;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{font-size:12.5px;color:#c0c0c0;display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small.off{color:#c0c0c0}
.me .btnSet{margin-left:auto;width:38px;height:38px;flex-shrink:0;border-radius:50%;background:transparent;color:#e8e8e8;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.me .btnSet:active{background:rgba(255,255,255,.12)}
.dot{width:8px;height:8px;border-radius:50%;background:#888}.dot.on{background:#e8e8e8;box-shadow:0 0 8px rgba(255,255,255,.7)}
.chat{flex:1;min-height:0;padding:14px 12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.msgRow{display:flex;gap:8px;align-items:flex-start;max-width:100%}
.msgRow.mine{justify-content:flex-end}
.msgAvatar{width:38px;height:38px;min-width:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#111;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,#e8e8e8,#b0b0b0)}
.msgAvatar.owner{background:linear-gradient(135deg,#FFD700,#FFB800);color:#000;border:1px solid #FFD700}
.msg{max-width:calc(100% - 46px);padding:8px 10px 6px;border-radius:12px;font-size:14px;line-height:1.4;word-break:break-word;background:linear-gradient(135deg,#e8e8e8,#c0c0c0);color:#111;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer}
.msgRow.mine .msg{max-width:85%;background:linear-gradient(135deg,#222,#000);color:#fff}
.msg.owner{background:linear-gradient(135deg,#FFD700,#FFB800);color:#000;border:1px solid #FFD700;box-shadow:0 2px 8px rgba(255,215,0,.35)}
.msg.owner b{color:#000}
.msg.owner .jam{color:#3a2f0a}
.msg.owner .ke{color:#3a2f0a}
.msg b{font-size:13.5px;font-weight:700;color:#111;display:block;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .isi{font-size:15px;line-height:1.4;color:inherit;white-space:pre-wrap;word-break:break-word}
.msg .jamRow{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:2px}
.msg .jam{font-size:11px;color:#555}
.msgRow.mine .msg .jam{color:#aaa}
.msg .centang{font-size:12px;color:#53bdeb;font-weight:700}
.msg .ke{font-size:10px;color:#555}
.msgRow.mine .msg .ke{color:#aaa}
.hapusWrap{display:flex;justify-content:flex-end;margin-top:5px}
.hapusBtn{padding:7px 12px;border-radius:9px;border:none;background:#ff2222;color:#fff;font-weight:900;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px}
.hapusBtn.batal{background:rgba(255,255,255,.15);color:#fff}
.sys{align-self:center;background:rgba(0,0,0,.6);border:1px dashed rgba(255,255,255,.4);text-align:center;font-size:12px;max-width:95%;padding:8px 12px;border-radius:12px;color:#fff}
.typing{padding:0 14px;font-size:11px;color:#e8e8e8;min-height:16px;font-weight:700;flex-shrink:0}
.bar{display:flex;gap:8px;padding:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.12);align-items:center;flex-shrink:0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.bar input{flex:1;padding:13px 16px;border-radius:24px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.65);color:#fff;outline:none;font-size:14px}
.bar input::placeholder{color:#888}
.bar input:focus{border-color:rgba(255,255,255,.35);background:rgba(0,0,0,.75)}
.bar button{width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(180,180,180,.8));color:#111;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bar button:disabled{opacity:.6}
.warn{margin:10px 12px 0;padding:11px;border-radius:14px;text-align:center;font-size:12px;font-weight:900}.warn.red{background:#ff2222}.warn.yellow{background:#ffb800;color:#000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}.modal.show{display:flex}
.box{width:100%;max-width:340px;background:linear-gradient(180deg,rgba(240,242,245,.16),rgba(0,0,0,.9));border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:20px;backdrop-filter:blur(10px)}
.box input{width:100%;padding:13px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.25);margin-top:12px;text-align:center}
.box button{width:100%;padding:12px;border-radius:12px;border:none;font-weight:900;margin-top:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.drawer{position:fixed;top:0;left:-300px;width:285px;height:100%;background:linear-gradient(180deg,rgba(240,242,245,.95),rgba(180,180,180,.9) 40%,#111);z-index:50;transition:.3s;padding:18px}
.drawer.open{left:0}.drawer a{display:flex;gap:10px;align-items:center;padding:13px 10px;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.15);font-weight:700}
.drawer a .dico{width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.navLabel{font-size:11px;letter-spacing:2px;color:#444;font-weight:900;padding:14px 10px 6px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><button class="burger" onclick="document.getElementById('drawer').classList.toggle('open')"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b>CHAT DKV<span id="topOnline">DKV • SILVER BLACK</span></b><span class="pill"><span class="dot on"></span><span id="onlineCount">0</span></span><a class="home" href="index.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a></div>
<div class="me"><div class="ava" id="meAva">?<span class="dotOnline" id="meDot"></span></div><div style="flex:1;min-width:0"><b id="meNama">Belum isi nama</b><small id="meSub" class="off">Isi nama dulu baru bisa chat</small></div><button class="btnSet" onclick="bukaNama(false)" title="Pengaturan - Ubah Nama"><svg class="ic" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 5a2 2 0 1 1 0-0.01M12 12a2 2 0 1 1 0-0.01M12 19a2 2 0 1 1 0-0.01" fill="currentColor" stroke="none"/></svg></button></div>
<div id="warnArea"></div>
<div class="chat" id="chatList">Isi nama dulu baru bisa liat chat...</div>
<div class="typing" id="typingBox"></div>
<div class="bar"><input id="pesanInput" placeholder="Isi nama dulu..." disabled><button id="btnKirim" onclick="kirimChat()"><svg class="ic" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button></div>
</div>
<div class="drawer" id="drawer"><h3 style="color:#111">KELAS DKV</h3><p style="color:#444;font-size:12px;margin:4px 0 0">CHAT DKV <br /><small>ALFARIZI</small></p>
<div class="navLabel">HOME</div>
<a href="index.html"><span class="dico"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span> Home</a>
<a href="chat.html"><span class="dico"><svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 21l2-5.6A8.5 8.5 0 1 1 21 11.5z"/></svg></span> Chat</a>
<div class="navLabel">OWNER</div>
<a href="upload.html"><span class="dico"><svg class="ic" viewBox="0 0 24 24"><path d="M3 8l4 4 5-6 5 6 4-4v10H3z"/><path d="M3 18h18"/></svg></span> Owner</a>
<br><button onclick="document.getElementById('drawer').classList.remove('open')" style="width:100%;padding:11px;border-radius:10px;border:none;font-weight:900">Tutup</button></div>
<div class="modal" id="modalNama"><div class="box"><h3 id="modalJudul">Siapa Nama Lu?</h3><p style="font-size:12px;color:#aaa;margin-top:4px">Isi nama dulu baru bisa masuk chat. Nama ini yang muncul di chat.</p><input id="namaInput" maxlength="20" placeholder="Contoh: Rizi" onkeydown="if(event.key==='Enter')simpanNama()"><button style="background:#fff;color:#000" onclick="simpanNama()"><svg class="ic" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg> MASUK CHAT</button><button id="btnBatalNama" style="background:#333;color:#fff" onclick="tutupNama()">Batal</button></div></div>
<script>
var CHAT_ID="21ba649c319a2054608c";var PRESENCE_ID="71d20ec46da14819e418";var BAN_ID="b35d8c7b99398ba2db31";
var URL_CHAT="https://api.npoint.io/"+CHAT_ID;var URL_PRESENCE="https://api.npoint.io/"+PRESENCE_ID;var URL_BAN="https://api.npoint.io/"+BAN_ID;
var namaKu="",myUid="",chats=[],presence=[],banned=[],muted=[],typingTerakhir=0,udahMasuk=false;
var chatDipilih='';
var idChatTerakhir=null, sudahScrollAwal=false, lagiKirim=false;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function getUid(){ var u=localStorage.getItem('alfarizi_uid'); if(!u){ u='U'+Date.now().toString(36)+Math.floor(Math.random()*100000).toString(36); localStorage.setItem('alfarizi_uid',u); } return u; }
function namaDariUid(uid){ if(!uid) return ''; for(var i=0;i<presence.length;i++){ if(presence[i].uid===uid) return presence[i].nama; } return ''; }
function isMine(c){ if(c.uid) return c.uid===myUid; return c.nama===namaKu; }
function kenaBan(){ if(!namaKu) return false; if(banned.indexOf(namaKu)!==-1) return true; if(myUid && banned.indexOf(myUid)!==-1) return true; return false; }
function kenaMute(){ if(!namaKu) return false; if(muted.indexOf(namaKu)!==-1) return true; if(myUid && muted.indexOf(myUid)!==-1) return true; return false; }
function warnaProfil(uid, nama){ return '#c0c0c0'; }
function jamSaja(t){ if(!t) return ''; var m=String(t).match(/(\d{1,2})[.:](\d{2})/); if(m) return m[1]+'.'+m[2]; return String(t).slice(-5); }
function scrollKeBawah(){
  var list=document.getElementById('chatList');
  if(!list) return;
  requestAnimationFrame(function(){ list.scrollTop=list.scrollHeight; });
}
function namaOnlineTeks(){
  var on=presence.filter(isOnline);
  if(!on.length) return '';
  return on.map(function(p){ return p.nama + ((p.uid && p.uid===myUid) ? ' (Lu)' : ''); }).join(', ');
}
function updateOnlineHeader(){
  var teks=namaOnlineTeks();
  var topEl=document.getElementById('topOnline');
  if(topEl) topEl.innerText = teks ? teks+' • ONLINE' : 'DKV • SILVER BLACK';
  var on=presence.filter(isOnline);
  var c=document.getElementById('onlineCount');
  if(c) c.innerText=on.length;
}
function setMeOnline(on){
  var sub=document.getElementById('meSub');
  var dot=document.getElementById('meDot');
  var teks=namaOnlineTeks();
  if(on){ sub.innerText = teks ? teks+' • Online' : 'online'; sub.classList.remove('off'); if(dot) dot.style.background='#00a884'; }
  else { sub.innerText='terakhir dilihat baru saja'; sub.classList.add('off'); if(dot) dot.style.background='#8696a0'; }
  updateOnlineHeader();
}
function bukaNama(wajib){ var inp=document.getElementById('namaInput'); inp.value = namaKu ? namaKu : ''; document.getElementById('modalJudul').innerText = namaKu ? 'Pengaturan - Ubah Nama' : 'Siapa Nama Lu?'; document.getElementById('btnBatalNama').style.display = wajib ? 'none' : 'flex'; document.getElementById('modalNama').classList.add('show'); setTimeout(function(){ inp.focus(); },100); }
function tutupNama(){ if(!namaKu){ return; } document.getElementById('modalNama').classList.remove('show'); }
function simpanNama(){
  var v=document.getElementById('namaInput').value.trim();
  if(!v) return alert('Isi nama dulu!');
  if(v.toLowerCase().indexOf('owner')!==-1) return alert('Nama itu khusus Owner!');
  namaKu=v; localStorage.setItem('alfarizi_nama',namaKu);
  document.getElementById('meNama').innerText=namaKu;
  var ava=document.getElementById('meAva'); ava.innerHTML=esc(namaKu.charAt(0).toUpperCase())+'<span class="dotOnline" id="meDot"></span>';
  setMeOnline(true);
  document.getElementById('modalNama').classList.remove('show');
  var inp=document.getElementById('pesanInput'); inp.disabled=false; inp.placeholder='Ketik pesan... @nama buat DM';
  if(!udahMasuk){ udahMasuk=true; cekSemua(); kirimPresence(false); setInterval(cekSemua,3000); setInterval(function(){kirimPresence(Date.now()-typingTerakhir<3000)},5000); }
  else { kirimPresence(false); cekSemua(); }
}
function mulai(){
  myUid=getUid();
  var s=localStorage.getItem('alfarizi_nama');
  if(s){ namaKu=s; document.getElementById('meNama').innerText=namaKu; var ava=document.getElementById('meAva'); ava.innerHTML=esc(namaKu.charAt(0).toUpperCase())+'<span class="dotOnline" id="meDot"></span>'; setMeOnline(true); var inp=document.getElementById('pesanInput'); inp.disabled=false; inp.placeholder='Ketik pesan... @nama buat DM'; udahMasuk=true; cekSemua(); kirimPresence(false); setInterval(cekSemua,3000); setInterval(function(){kirimPresence(Date.now()-typingTerakhir<3000)},5000); }
  else { namaKu=""; document.getElementById('meNama').innerText='Belum isi nama'; document.getElementById('meAva').innerHTML='?<span class="dotOnline" id="meDot"></span>'; setMeOnline(false); document.getElementById('pesanInput').disabled=true; bukaNama(true); }
  var inp2=document.getElementById('pesanInput'); inp2.addEventListener('keydown',function(e){if(e.key==='Enter')kirimChat()}); inp2.addEventListener('input',function(){typingTerakhir=Date.now(); if(namaKu) kirimPresence(true)});
}
function isOnline(p){var ts=Number(p.lastSeen)||0;return ts&&(Date.now()-ts)<60000}
function formatLast(ts){ts=Number(ts)||0;if(!ts)return 'Offline';var d=Math.floor((Date.now()-ts)/1000);if(d<60)return 'Online';if(d<3600)return Math.floor(d/60)+' mnt lalu';if(d<86400)return Math.floor(d/3600)+' jam lalu';return Math.floor(d/86400)+' hari lalu'}
async function kirimPresence(typing){ if(!namaKu) return; try{ var r=await fetch(URL_PRESENCE,{cache:'no-store'});var d=await r.json();if(!Array.isArray(d))d=[]; d=d.filter(function(x){ if(x.uid && x.uid===myUid) return false; return true; }); var idx=d.findIndex(function(x){return x.uid===myUid}); var data={uid:myUid,nama:namaKu,lastSeen:Date.now(),firstSeen:Date.now(),page:'Chat',device:'HP',typing:!!typing}; if(idx>=0) d[idx]=data; else d.push(data); await fetch(URL_PRESENCE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}); }catch(e){} }
async function cekSemua(){ if(!namaKu) return; try{var r=await fetch(URL_CHAT,{cache:'no-store'});var d=await r.json();if(Array.isArray(d))chats=d}catch(e){} try{ var r2=await fetch(URL_PRESENCE,{cache:'no-store'});var d2=await r2.json(); if(Array.isArray(d2)){ var map={}; d2.forEach(function(p){ var key=p.uid || ('NAMA:'+p.nama); if(!map[key] || Number(p.lastSeen||0) > Number(map[key].lastSeen||0)) map[key]=p; }); presence=Object.values(map); } }catch(e){} try{var r3=await fetch(URL_BAN,{cache:'no-store'});var d3=await r3.json();if(d3){banned=d3.banned||[];muted=d3.muted||[]}}catch(e){} render(); }
function tekanChatKu(id){
  chatDipilih = (chatDipilih===String(id) ? '' : String(id));
  render();
}
async function hapusChatKu(id){
  var c=null;
  for(var i=0;i<chats.length;i++){ if(String(chats[i].id)===String(id)) c=chats[i]; }
  if(!c) return;
  if(!isMine(c)) return alert('Itu bukan chat lu, gak bisa dihapus!');
  if(!confirm('Hapus chat lu ini?')) return;
  try{
    var r=await fetch(URL_CHAT,{cache:'no-store'});var d=await r.json();if(!Array.isArray(d))d=[];
    d=d.filter(function(x){ return String(x.id)!==String(id); });
    await fetch(URL_CHAT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    chatDipilih='';
    cekSemua();
  }catch(e){ alert('Gagal hapus!'); }
}
function render(){
  var w=document.getElementById('warnArea');
  if(kenaBan()) w.innerHTML='<div class="warn red">LU DI-BAN SAMA OWNER!</div>';
  else if(kenaMute()) w.innerHTML='<div class="warn yellow">LU DI-MUTE!</div>';
  else w.innerHTML='';
  updateOnlineHeader();
  var ty=presence.filter(function(p){return p.typing && p.uid!==myUid && p.nama!==namaKu});
  document.getElementById('typingBox').innerText=ty.length?ty.map(function(x){return x.nama}).join(', ')+' lagi ngetik...':'';
  if(namaKu) setMeOnline(true);
  var list=document.getElementById('chatList');
  if(!chats.length){list.innerHTML='Belum ada chat. Jadi yang pertama!';return}
  var out='';
  chats.forEach(function(c){
    if(c.isSystem){out+='<div class="sys">'+esc(c.teks)+'</div>';return}
    var mine=isMine(c);
    var isOwner=c.isOwner||(c.nama&&c.nama.indexOf('Owner')!==-1);
    var namaTampil = c.uid ? (namaDariUid(c.uid) || c.nama) : c.nama;
    var isi=c.sticker?'<div style="font-size:48px">'+esc(c.sticker)+'</div>':esc(c.teks||'');
    var toTampil=c.to ? esc(c.to) : '';
    if(c.toUid && c.toUid===myUid) toTampil='Lu';
    var keHtml = toTampil ? '<div class="ke">Ke: '+toTampil+'</div>' : '';
    if(mine){
      var hapusHtml='';
      if(chatDipilih===String(c.id)){
        hapusHtml='<div class="hapusWrap"><button class="hapusBtn" onclick="event.stopPropagation();hapusChatKu(\''+c.id+'\')">🗑️ Hapus</button><button class="hapusBtn batal" onclick="event.stopPropagation();tekanChatKu(\''+c.id+'\')">Batal</button></div>';
      }
      out+='<div class="msgRow mine"><div style="display:flex;flex-direction:column;align-items:flex-end;max-width:85%"><div class="msg" onclick="tekanChatKu(\''+c.id+'\')"><div class="isi">'+isi+'</div>'+keHtml+'<div class="jamRow"><span class="jam">'+esc(jamSaja(c.time))+'</span><span class="centang">✓</span></div></div>'+hapusHtml+'</div></div>';
    } else {
      var inisial=(namaTampil||'?').charAt(0).toUpperCase();
      var avatarClass=isOwner?'msgAvatar owner':'msgAvatar';
      var avatar='<div class="'+avatarClass+'">'+esc(inisial)+'</div>';
      var label=isOwner?'~ Owner':('~ '+namaTampil);
      var msgClass=isOwner?'msg owner':'msg';
      out+='<div class="msgRow" onclick="klikOrang(\''+esc(namaTampil)+'\')">'+avatar+'<div class="'+msgClass+'"><b>'+esc(label)+'</b><div class="isi">'+isi+'</div>'+keHtml+'<div class="jamRow"><span class="jam">'+esc(jamSaja(c.time))+'</span></div></div></div>';
    }
  });
  list.innerHTML=out;
  var idBaru = chats.length ? String(chats[chats.length-1].id) : null;
  var adaChatBaru = (idBaru !== idChatTerakhir);
  idChatTerakhir = idBaru;
  if(!sudahScrollAwal || adaChatBaru){ sudahScrollAwal=true; scrollKeBawah(); }
}
function klikOrang(nama){if(!nama||nama===namaKu)return;var inp=document.getElementById('pesanInput');inp.value='@'+nama+' ';inp.focus()}
async function kirimChat(){
  if(lagiKirim) return;
  if(!namaKu){ bukaNama(true); return; }
  var inp=document.getElementById('pesanInput');var teks=inp.value.trim();if(!teks)return;
  if(kenaBan()) return alert('Lu di-ban!');
  if(kenaMute()) return alert('Lu di-mute!');
  var to='';var toUid='';
  var m=teks.match(/^@(\S+)\s+/);
  if(m){ to=m[1]; for(var i=0;i<presence.length;i++){ if(presence[i].nama===to){ toUid=presence[i].uid||''; break; } } }
  var pesanBaru={id:Date.now(),uid:myUid,nama:namaKu,teks:teks,time:new Date().toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),to:to||undefined,toUid:toUid||undefined};
  lagiKirim=true;
  var btn=document.getElementById('btnKirim'); if(btn) btn.disabled=true;
  inp.value='';
  chats.push(pesanBaru);
  render();
  scrollKeBawah();
  try{
    var r=await fetch(URL_CHAT,{cache:'no-store'});var d=await r.json();if(!Array.isArray(d))d=[];
    if(!d.find(function(x){return String(x.id)===String(pesanBaru.id)})) d.push(pesanBaru);
    if(d.length>300)d=d.slice(-300);
    await fetch(URL_CHAT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    typingTerakhir=0;kirimPresence(false);cekSemua();
  }catch(e){ alert('Gagal kirim! Coba lagi, chat lu masih kesimpen di layar.'); }
  lagiKirim=false;
  if(btn) btn.disabled=false;
  inp.focus();
}
mulai();
</script>
