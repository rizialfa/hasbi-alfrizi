function getTipe(k){

function buatEmbed(link,untukViewer,tipe){
  link=String(link||'').trim();if(!link)return{jenis:'kosong',embed:''};

    if(/\.(mp4|mov|webm|m4v|mkv)(\?|#|$)/.test(low))return{jenis:'mp4',embed:link};
    if(tipe==='foto')return{jenis:'foto',embed:link};
    return{jenis:'mp4',embed:link};
  }
  let ytId='';let m1=link.match(/[?&]v=([^&#]+)/);let m2=link.match(/youtu\.be\/([^?&#]+)/);let m3=link.match(/shorts\/([^?&#]+)/);let m4=link.match(/embed\/([^?&#]+)/);

function simpanLiked(l){localStorage.setItem('dkv_komen_liked',JSON.stringify(l))}
function ambilKomenLokal(){try{return JSON.parse(localStorage.getItem('dkv_komen_list')||'[]')}catch(e){return[]}}
function komenUntukKarya(id,judul){let map={};let k=karyaList.find(x=>x.id===id);if(k&&Array.isArray(k.komen))k.komen.forEach(c=>{map[c.id]=JSON.parse(JSON.stringify(c))});ambilKomenLokal().filter(x=>String(x.karyaId)===String(id)||x.karya===judul).forEach(l=>{if(map[l.id]){let g=[...(map[l.id].balas||[])];(l.balas||[]).forEach(b=>{if(!g.find(x=>x.teks===b.teks&&x.nama===b.nama))g.push(b)});map[l.id].balas=g;if(map[l.id].likes==null)map[l.id].likes=l.likes||0;if(!map[l.id].komen)map[l.id].komen=l.komen||l.teks}else{map[l.id]=JSON.parse(JSON.stringify(l))}});return Object.values(map).sort((a,b)=>a.id-b.id)}
function renderKomenBox(){let k=karyaList.find(x=>x.id===komenId);if(!k)return;let list=komenUntukKarya(komenId,k.judul),liked=ambilLiked();document.getElementById('komenJudul').innerText='💬 Komentar - '+k.judul+' ('+list.length+')';if(!list.length){document.getElementById('komenListBox').innerHTML='<p style="font-size:12px;color:#888;padding:10px 0;text-align:center">Belum ada komen.<br>Jadi yang pertama komen!</p>';return}document.getElementById('komenListBox').innerHTML=list.map(c=>{let bh=(c.balas||[]).map(b=>`<div class="balasBox"><b>${escapeHtml(b.nama||OWNER_NAME)}</b> <small>• ${escapeHtml(b.waktu||waktuKomen(b.ts||b.id))}</small><p>${escapeHtml(b.teks)}</p></div>`).join('');let sl=liked.includes(c.id),jl=c.likes||0;return `<div class="komenItem"><b>👤 ${escapeHtml(c.nama)}</b><span class="komenWaktu">🕒 ${escapeHtml(waktuKomen(tsKomen(c)))}</span><p>${escapeHtml(c.komen||c.teks||'')}</p>${bh}<button class="btnLike ${sl?'liked':''}" onclick="toggleLike(${c.id},event)">${sl?'❤️':'🤍'} ${jl} Suka</button></div>`}).join('')}
async function toggleLike(id,ev){if(ev)ev.stopPropagation();let liked=ambilLiked(),sd=liked.includes(id);if(sd)liked=liked.filter(x=>x!==id);else liked.push(id);simpanLiked(liked);karyaList.forEach(k=>{(k.komen||[]).forEach(c=>{if(c.id===id)c.likes=Math.max(0,(c.likes||0)+(sd?-1:1))})});let lok=ambilKomenLokal();lok.forEach(l=>{if(l.id===id)l.likes=Math.max(0,(l.likes||0)+(sd?-1:1))});localStorage.setItem('dkv_komen_list',JSON.stringify(lok));renderKomenBox();try{await fetch(URL_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(karyaList)});lastDataString=""}catch(e){}}
function bukaKomen(id){let k=karyaList.find(x=>x.id===id);if(!k)return;komenId=id;let s=localStorage.getItem('dkv_nama_komen');if(s)document.getElementById('komenNama').value=s;document.getElementById('komenIsi').value='';renderKomenBox();document.getElementById('komenModal').classList.add('show');document.body.style.overflow='hidden';document.querySelectorAll('.autoVideo').forEach(v=>v.pause())}
function tutupKomen(){komenId=null;document.getElementById('komenModal').classList.remove('show');document.body.style.overflow='visible';document.documentElement.style.overflow='visible';playSemuaVideoDepan()}
/* === KOMEN DIPERBAIKI TOTAL DI SINI === */
async function postKaryaListDenganRetry(data){
  for(let percobaan=1;percobaan<=3;percobaan++){
    try{
      let r=await fetch(URL_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
      if(!r.ok)throw new Error('POST '+r.status);
      await new Promise(res=>setTimeout(res,800));
      let cek=await fetch(URL_API,{cache:'no-store'}); let cekData=await cek.json();
      let listCek=Array.isArray(cekData)?cekData:(Array.isArray(cekData.data)?cekData.data:[]);
      return {ok:true,server:listCek};
    }catch(e){ if(percobaan<3) await new Promise(res=>setTimeout(res,1000*percobaan)); else return {ok:false,server:null}; }
  }
}
async function kirimKomenBox(){
  if(lagiKirimKomen)return;
  let idKarya=komenId;
  let k=karyaList.find(x=>x.id===idKarya);
  if(!k){toast('Buka komennya dulu!');return}
  let nama=document.getElementById('komenNama').value.trim()||'Anonim';
  let isi=document.getElementById('komenIsi').value.trim();
  if(!isi){toast('Tulis komen dulu!');return}
  localStorage.setItem('dkv_nama_komen',nama);
  let btn=document.getElementById('btnKirimKomen');
  lagiKirimKomen=true; if(btn){btn.disabled=true;btn.innerText='⏳ LAGI NGIRIM...'}
  let sk=Date.now();
  let baru={id:sk,ts:sk,karyaId:idKarya,karya:k.judul,nama:nama,komen:isi,teks:isi,likes:0,waktu:new Date().toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),balas:[]};
  let lok=ambilKomenLokal(); lok.push(baru); localStorage.setItem('dkv_komen_list',JSON.stringify(lok));
  if(!Array.isArray(k.komen))k.komen=[]; k.komen.push(baru);
  document.getElementById('komenIsi').value='';
  renderKomenBox(); render();
  toast('⏳ Lagi ngirim komen ke owner...');
  let hasil=await postKaryaListDenganRetry(karyaList);
  if(hasil.ok){
    lastDataString="";
    if(hasil.server&&hasil.server.length){ let srv=hasil.server.find(x=>x.id===idKarya); if(srv&&Array.isArray(srv.komen)&&srv.komen.find(c=>c.id===sk)){ toast('✅ Komen terkirim ke owner!'); } else { toast('✅ Komen kesimpen, owner bisa liat pas refresh.'); } }
    else toast('✅ Komen terkirim ke owner!');
  }else{
    toast('⚠️ Internet / server lagi susah. Komen lu udah kesimpen, bakal auto ke-kirim sendiri pas lu buka web lagi.');
  }
  lagiKirimKomen=false; if(btn){btn.disabled=false;btn.innerText='💬 KIRIM KOMEN KE OWNER'}
}
async function syncKomenTertunda(){
  if(lagiSyncKomen||lagiKirimKomen)return; let lok=ambilKomenLokal(); if(!lok.length)return;
  lagiSyncKomen=true;
  try{
    let r=await fetch(URL_API,{cache:'no-store'}); let d=await r.json(); let srv=Array.isArray(d)?d:(Array.isArray(d.data)?d.data:[]);
    let berubah=false;
    lok.forEach(l=>{ let kk=srv.find(x=>x.id===l.karyaId||x.judul===l.karya); if(kk){ if(!Array.isArray(kk.komen))kk.komen=[]; if(!kk.komen.find(c=>c.id===l.id)){kk.komen.push(JSON.parse(JSON.stringify(l))); berubah=true;} } });
    if(berubah){ let hasil=await postKaryaListDenganRetry(srv); if(hasil.ok){ lastDataString=""; } }
  }catch(e){}
  lagiSyncKomen=false;
}
function bukaViewer(id){let k=karyaList.find(x=>x.id===id);if(!k)return;isViewerOpen=true;viewerVideoEl=null;viewerId=id;let tipe=getTipe(k),link=getFotoLink(k)||getLink(k);document.getElementById('viewerJudul').innerText=(tipe==='foto'?'📸 ':'🎬 ')+k.judul;document.getElementById('viewerNama').innerText='👤 '+k.nama;document.getElementById('viewerDesk').innerText=k.desk||'Tanpa deskripsi.';document.getElementById('viewerMeta').innerText=k.kategori+' • '+k.waktu;let main=document.getElementById('viewerMain'),btn=document.getElementById('btnSuaraView');main.innerHTML='';if(tipe==='foto'){btn.style.display='none';let img=document.createElement('img');img.src=link;img.onerror=function(){fotoJadiVideo(img)};main.appendChild(img)}else{let emb=buatEmbed(link,true,tipe);if(emb.jenis==='youtube'){btn.style.display='none';let ifr=document.createElement('iframe');ifr.src=emb.embed;ifr.allow='autoplay; encrypted-media; fullscreen';ifr.allowFullscreen=true;main.appendChild(ifr)}else if(emb.jenis==='mp4'){btn.style.display='block';btn.innerText='🔊 SUARA: OFF - Klik buat ON';let v=document.createElement('video');v.src=emb.embed;v.autoplay=true;v.muted=true;v.loop=true;v.playsInline=true;v.controls=true;v.preload='auto';let f=getFotoLink(k);if(f)v.poster=f;v.onerror=function(){videoJadiFoto(v)};v.onclick=()=>{if(v.muted){v.muted=false;btn.innerText='🔊 SUARA: ON'}};main.appendChild(v);viewerVideoEl=v;v.play().catch(()=>{})}else if(emb.jenis==='drive'){btn.style.display='none';let ifr=document.createElement('iframe');ifr.src=emb.embed;ifr.allow='autoplay; fullscreen';ifr.allowFullscreen=true;main.appendChild(ifr)}else if(emb.jenis==='foto'){btn.style.display='none';let img=document.createElement('img');img.src=emb.embed;img.onerror=function(){fotoJadiVideo(img)};main.appendChild(img)}else if(emb.jenis==='kosong'){btn.style.display='none';main.innerHTML='<div style="text-align:center;color:#fff;padding:20px">❌ Link kosong</div>'}else{btn.style.display='none';main.innerHTML=`<div style="text-align:center"><div style="font-size:60px">🎬</div><div style="margin-top:12px;color:#fff">Video harus dibuka di app-nya.</div><br><button onclick="window.open('${escapeAttr(link)}','_blank')" style="padding:12px 20px;border:none;border-radius:12px;background:#e8e8ec;font-weight:900;color:#111">▶️ BUKA LINK</button></div>`}}document.getElementById('viewer').classList.add('show');document.body.style.overflow='hidden';document.querySelectorAll('.autoVideo').forEach(v=>v.pause())}
function tutupViewer(){isViewerOpen=false;document.getElementById('viewer').classList.remove('show');document.getElementById('viewerMain').innerHTML='';document.body.style.overflow='visible';document.documentElement.style.overflow='visible';viewerVideoEl=null;viewerId=null;playSemuaVideoDepan()}
function toggleSuaraViewer(){if(!viewerVideoEl)return;viewerVideoEl.muted=!viewerVideoEl.muted;document.getElementById('btnSuaraView').innerText=viewerVideoEl.muted?'🔊 SUARA: OFF - Klik buat ON':'🔊 SUARA: ON';if(!viewerVideoEl.muted)viewerVideoEl.play()}
function klikViewerMain(e){if(e.target.id==='viewerMain')tutupViewer()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){tutupViewer();tutupKomen();toggleMenu(false)}});
async function ambilData(force){if(lagiAmbil||lagiKirimKomen||lagiSyncKomen)return;lagiAmbil=true;try{let r=await fetch(URL_API,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let d=await r.json();let baru=Array.isArray(d)?d:(Array.isArray(d.data)?d.data:[]);let lok=ambilKomenLokal();baru.forEach(kk=>{if(!Array.isArray(kk.komen))kk.komen=[];lok.filter(l=>String(l.karyaId)===String(kk.id)||l.karya===kk.judul).forEach(l=>{if(!kk.komen.find(c=>c.id===l.id))kk.komen.push(JSON.parse(JSON.stringify(l)))})});let str=JSON.stringify(baru)+'|'+filter;if(force||str!==lastDataString||!sudahPernahLoad){lastDataString=str;karyaList=baru;sudahPernahLoad=true;render();if(komenId)renderKomenBox()}document.getElementById('lastUpdate').innerText='UPDATE '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch(e){if(!sudahPernahLoad){document.getElementById('slider').innerHTML='<div class="empty">❌ Gagal nyambung.<br><button onclick="refreshManual()" style="margin-top:12px;padding:11px 18px;border:none;border-radius:12px;background:#e8e8ec;color:#111;font-weight:900">🔄 COBA LAGI</button></div>'}document.getElementById('lastUpdate').innerText='GAGAL - COBA LAGI'}finally{lagiAmbil=false}}
function render(){
  document.getElementById('totalKarya').innerText=karyaList.length+' KARYA';
  let slider=document.getElementById('slider'),f=String(filter||'Semua').toLowerCase();
  let tampil=karyaList.filter(k=>{if(f==='semua')return true;return getTipe(k)===f||String(k.kategori||'').toLowerCase()===f});
  if(!tampil.length){slider.innerHTML='<div class="empty">Belum ada karya di filter ini.<br><button onclick="location.href=\'upload.html\'" style="margin-top:10px;padding:10px 16px;border:none;border-radius:12px;background:#e8e8ec;color:#111;font-weight:900">➕ Upload Pertama</button></div>';return}
  slider.innerHTML=tampil.map((k,idx)=>{
    let tipe=getTipe(k),foto=getFotoLink(k),link=foto||getLink(k),media='';
    if(tipe==='foto'){media=link?`<img src="${escapeAttr(link)}" loading="lazy" decoding="async" onerror="fotoJadiVideo(this)">`:`<div class="videoGagal"><b>📸 FOTO GAK KE-BACA</b><small>Link kosong</small></div>`}
    else{let emb=buatEmbed(link,false,tipe);if(emb.jenis==='youtube')media=`<iframe src="${escapeAttr(emb.embed)}" loading="eager" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;else if(emb.jenis==='mp4')media=`<video src="${escapeAttr(emb.embed)}" ${foto&&foto!==link?`poster="${escapeAttr(foto)}"`:''} autoplay muted loop playsinline preload="auto" class="autoVideo" data-idx="${idx}" onerror="videoJadiFoto(this)"></video>`;else if(emb.jenis==='drive')media=`<iframe src="${escapeAttr(emb.embed)}" loading="eager" allow="autoplay; fullscreen"></iframe>`;else if(emb.jenis==='foto')media=`<img src="${escapeAttr(emb.embed)}" loading="lazy" onerror="fotoJadiVideo(this)">`;else if(emb.jenis==='kosong')media=`<div class="videoGagal"><b>🎬 VIDEO GAK KE-BACA</b><small>Link kosong</small></div>`;else media=`<div class="videoGagal"><b>🎬 VIDEO</b><small>Klik LIAT</small></div><div class="playBadge"><span>▶</span></div>`}
    let kl=komenUntukKarya(k.id,k.judul),kp=kl.length?`<div class="komenPreview">💬 <b>${escapeHtml(kl[kl.length-1].nama)}:</b> ${escapeHtml(kl[kl.length-1].komen||kl[kl.length-1].teks||'')}</div>`:'';
    // FOTO = GAK ADA TOMBOL SUARA. VIDEO = ADA TOMBOL SUARA. YANG LAIN SAMA.
    let btnSuaraHtml = (tipe==='foto') ? '' : `<button class="btnSuara" onclick="event.stopPropagation();toggleSuaraSlide(${k.id},event)">🔊</button>`;
    return `<div class="slide" data-id="${k.id}"><div class="slideMedia" onclick="bukaViewer(${k.id})">${media}</div><div class="slideInfo"><b>${escapeHtml(k.judul)}</b><p>${escapeHtml(k.desk||'Tanpa deskripsi.')}</p><div class="slideMeta"><span>👤 ${escapeHtml(k.nama)}</span><span>${escapeHtml(k.kategori)}</span></div>${kp}<div class="slideBtns"><button class="btnLihat" onclick="event.stopPropagation();bukaViewer(${k.id})">🔍 LIAT</button><button class="btnKomen" onclick="event.stopPropagation();bukaKomen(${k.id})">💬 ${kl.length}</button>${btnSuaraHtml}</div></div></div>`;
  }).join('');setupSliderAuto();updateProgress();
}
function toggleSuaraSlide(id,ev){let s=document.querySelector(`.slide[data-id="${id}"] video`);if(!s){toast('Video ini dari YouTube / Drive, suara di viewer aja');bukaViewer(id);return}s.muted=!s.muted;if(!s.muted)s.play();toast(s.muted?'🔇 Suara OFF':'🔊 Suara ON')}
function updateProgress(){if(progressRaf)return;progressRaf=requestAnimationFrame(()=>{progressRaf=null;let t=document.body.scrollHeight-window.innerHeight,p=t>0?Math.round(window.scrollY/t*100):0;if(p!==lastProgress){lastProgress=p;document.getElementById('progressFill').style.width=p+'%'}})}
window.addEventListener('scroll',updateProgress,{passive:true});
function playSemuaVideoDepan(){if(isViewerOpen||komenId)return;document.querySelectorAll('.autoVideo').forEach(v=>{let r=v.getBoundingClientRect();if(r.top<window.innerHeight+100&&r.bottom>-100){v.muted=true;v.play().catch(()=>{})}})}
function setupSliderAuto(){currentObservers.forEach(o=>{try{o.disconnect()}catch(e){}});currentObservers=[];let vs=document.querySelectorAll('.autoVideo');if(!vs.length)return;vs.forEach(v=>{v.muted=true;v.play().catch(()=>{})});let obs=new IntersectionObserver(es=>{es.forEach(en=>{let vid=en.target;if(en.isIntersecting){vid.muted=true;vid.play().catch(()=>{})}else{vid.pause()}})},{threshold:[0.1],rootMargin:'100px'});vs.forEach(v=>obs.observe(v));currentObservers.push(obs)}
['touchstart','click','scroll'].forEach(ev=>{document.addEventListener(ev,playSemuaVideoDepan,{passive:true})});
ambilData(true);setInterval(()=>{syncKomenTertunda();ambilData(false)},30000);
</script>
